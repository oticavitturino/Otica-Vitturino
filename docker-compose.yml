services:
  backend:
    build:
      context: ./WEB/BACK/main
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: homolog
      DB_URL: jdbc:mysql://db:3306/usermanagementdb
      DB_USER: admin
      DB_PASSWORD: admin
      JWT_SECRET: ${JWT_SECRET:-my-secret-key}
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET:-3e5f6j7c8d9g10!PRO}"
      ENCRYPTION_SALT: "${ENCRYPTION_SALT:-deadbeefdeadbeef}"
      URL_FRONT: ${URL_FRONT:-http://localhost}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
    networks:
      - app-network

  frontend:
    build:
      context: ./WEB/FRONT
      dockerfile: dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mobile:
    build:
      context: ./MOBILE
      dockerfile: dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./MOBILE:/app
      - mobile_node_modules:/app/node_modules
    environment:
      EXPO_NO_TELEMETRY: "1"
      EXPO_OFFLINE: "1"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mysql:8.4
    container_name: mysql-db
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: usermanagementdb
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  mobile_node_modules:
