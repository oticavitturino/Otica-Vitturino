services:
  backend:
    build:
      context: ./WEB/BACK/main
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Sao_Paulo"
      SPRING_PROFILES_ACTIVE: homolog
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET}"
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      URL_FRONT: ${URL_FRONT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-s", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - app-network

  frontend:
    build:
      context: ./WEB/FRONT
      dockerfile: dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: mysql:8.4
    container_name: mysql-db
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: usermanagementdb
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  mobile_node_modules:
