<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelamento de Agendamento</title>
</head>
<body style="margin: 0; padding: 0;">
    <!-- Container -->
    <div style="display: flex; flex-direction: column; justify-content: flex-start; align-items: center; position: relative; z-index: 0; width: 100%; height: 100vh; padding: 5%; background-image: linear-gradient(rgba(231, 231, 231, 0.5), rgba(231, 231, 231, 0.5)), url('/img/pexels-steve-29506613.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;">
        
        <!-- Título -->
        <h1 style="font-family: 'Poppins', sans-serif; font-size: 2.2rem; font-weight: 600; color: #C75C50;">
            Seu agendamento foi cancelado!
        </h1>

        <!-- Ilustração -->
        <img src="../../assets/thumbs-down.png" alt="Ilustração" style="position: absolute; top: 5%; bottom: 0; left: 0; right: 8%; margin: auto; width: 25%; object-fit: cover; z-index: -1; opacity: 0.7;" />
    </div>
</body>
</html>
